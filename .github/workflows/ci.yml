name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev
  package:
    name: TV package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tooling --ignore-scripts
      - run: npm run build
      - run: node scripts/verify-package.cjs
      - run: sha256sum dist/*.ipk > dist/SHA256SUMS.txt
      - run: npm run build:setup
      - uses: actions/upload-artifact@v4
        with:
          name: setup-packages
          path: .build/setup-release/*
      - uses: actions/upload-artifact@v4
        with:
          name: tv-package
          path: dist/*.ipk
  container:
    name: Linux encoder and container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t overlay-ci .
      - run: docker run --rm --entrypoint node -v "$PWD/tests:/app/tests:ro" overlay-ci /app/tests/encoder-smoke.cjs
